services:
  sampler-api:
    build: .
    restart: unless-stopped
    environment:
      PORT: "8080"
      POT_PROVIDER_URL: "http://pot-provider:4416"
      FRONTEND_ORIGINS: "https://southernadd-cmyk.github.io"
    ports:
      - "8080:8080"
    depends_on:
      - pot-provider

  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:2.0.0
    restart: unless-stopped
    expose:
      - "4416"
