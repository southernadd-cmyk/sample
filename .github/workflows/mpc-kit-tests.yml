name: MPC Sample kit export checks
on:
  push:
    paths:
      - 'docs/mpc-kit-export.js'
      - 'docs/app.js'
      - 'docs/index.html'
      - 'tests/mpc-kit-export.test.cjs'
      - '.github/workflows/mpc-kit-tests.yml'
  pull_request:
    paths:
      - 'docs/mpc-kit-export.js'
      - 'docs/app.js'
      - 'docs/index.html'
      - 'tests/mpc-kit-export.test.cjs'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check docs/mpc-kit-export.js && node --check docs/app.js
      - run: node --test tests/mpc-kit-export.test.cjs
